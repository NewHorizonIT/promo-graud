spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      url: ${REDIS_URL}
      timeout: 2000ms

  batch:
    job:
      enabled: false

server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: framework

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

vnpay:
  tmn-code: ${TMN_CODE}
  hash-secret: ${HASH_SECRET}
  url: ${URL}
  return-url: ${VNPAY_RETURN_URL}

app:
  frontend-url: ${FE_RETURN_URL}

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}
  email: ${ADMIN_EMAIL}

jwt:
  secret: ${JWT_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  valid-duration: ${JWT_VALID_DURATION:3600}
  refresh-duration: ${JWT_REFRESH_DURATION:72000}

jobrunr:
  background-job-server:
    enabled: true
    worker-count: 2
    poll-interval: 15
  dashboard:
    enabled: false

voucher:
  batch:
    unique-threshold: 50
    chunk-size: 20

fraud:
  max-redemptions-per-ip-24h: 3
  max-users-per-device-24h: 3

rate-limit:
  requests-per-window: 5
  window-seconds: 60
