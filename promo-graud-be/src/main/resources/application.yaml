spring:
  profiles:
      active: dev
      default: dev
  application:
    name: promo-graud

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  tomcat:
    threads:
      max: 400
      min-spare: 20
    accept-count: 200

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs